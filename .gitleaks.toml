# Gitleaks configuration
#
# The default rules are extended unchanged. The only relaxation is a scoped
# path allowlist for the redaction test module, which deliberately contains
# fake credential strings so that the redaction filter can be verified.
#
# These values are not real credentials: they are locally defined constants
# used only as inputs to `redact()`. They are never sent anywhere and are
# not valid for any service.

[extend]
useDefault = true

[[allowlists]]
description = "Deliberate fake credentials used as redaction test inputs"
paths = [
    '''tests/runtime/test_logging\.py''',
]
