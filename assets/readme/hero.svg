  <title id="heroTitle">Attendance.Application — camera-based attendance verification</title>
  <desc id="heroDesc">A conceptual verification viewport showing a face landmark mesh, a live liveness session, a 0.653 face match, and a present attendance result. The project combines blink-based liveness, heuristic frame screening, InsightFace matching, and SQLite attendance records.</desc>

